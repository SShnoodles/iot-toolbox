[package]
name = "iot-toolbox"
version = "0.2.0"
edition = "2021"
rust-version = "1.98"

[dependencies]
anyhow = "1.0.100"
async-channel = "2"
chrono = "0.4.43"
gpui-kit = "0.9"
semver = "1"
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
serialport = "4.8.1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tokio-modbus = "0.17.0"

[build-dependencies]
winresource = "0.1.31"
